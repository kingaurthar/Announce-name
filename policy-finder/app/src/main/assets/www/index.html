<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policy Finder</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 12h8v1.6H8V12zm0 3.4h6v1.6H8v-1.6z"/></svg>
    <span id="title">Policy Finder</span>
  </div>
  <span class="sub" id="subtitle">Offline</span>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="search" class="active"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg><span>Find</span></button>
  <button data-tab="products"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg><span>Products</span></button>
  <button data-tab="docs"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/></svg><span>Policies</span></button>
  <button data-tab="grids"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v4h4V5H5zm6 0v4h4V5h-4zm6 0v4h2V5h-2zM5 11v4h4v-4H5zm6 0v4h4v-4h-4zm6 0v4h2v-4h-2zM5 17v2h4v-2H5zm6 0v2h4v-2h-4zm6 0v2h2v-2h-2z"/></svg><span>Vehicle/LTV</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span>More</span></button>
</nav>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button class="icon-btn" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M15.4 6.4 14 5l-7 7 7 7 1.4-1.4L9.8 12z"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <div id="sheetActions"></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="lib/pdf.min.js"></script>
<script src="db.js"></script>
<script src="search.js"></script>
<script src="qa.js"></script>
<script src="lib/ocr/tesseract.min.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
