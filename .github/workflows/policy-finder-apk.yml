name: Build Policy Finder APK

on:
  push:
    paths:
      - 'policy-finder/**'
      - '.github/workflows/policy-finder-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: policy-finder
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp policy-finder/app/build/outputs/apk/release/app-release.apk PolicyFinder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PolicyFinder-apk
          path: PolicyFinder.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: policy-finder-latest
          name: Policy Finder APK (latest)
          body: |
            Latest Policy Finder build (run #${{ github.run_number }}).
            Open this page on your Android phone, tap **PolicyFinder.apk** to download, then install
            (allow "Install unknown apps" for your browser / file manager if asked).
          prerelease: false
          make_latest: true
          files: PolicyFinder.apk
